




name: Facebook Live Broadcast

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Stream Platform (facebook ya okru)'
        required: true
        default: 'facebook'
        type: choice
        options:
          - facebook
          - okru
      target_url:
        description: 'Website URL (Jo stream karni hai)'
        required: true
        type: string
      stream_key:
        description: 'Stream Key (Facebook ya OK.ru ki)'
        required: true
        type: string
      duration:
        description: 'Stream ka time (Minutes mein)'
        required: true
        default: '30'
        type: string

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg & Xvfb (For Streaming)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Start Broadcast
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          PLATFORM: ${{ github.event.inputs.platform }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          DURATION: ${{ github.event.inputs.duration }}
        # Xvfb ek virtual screen banata hai taake headless: false kaam kar sake
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node broadcast.js





































